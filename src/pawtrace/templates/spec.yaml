# Paper spec — written at intake, before any build. Every equation, parameter,
# protocol detail and figure panel the replication needs, each stated (with its
# section) or missing. `pawtrace playbook intake` explains how to fill it.
paper:
  id: <paper-id>
  title: ""
  authors: []
  year: null
  doi: ""
  version: published        # which version you read (preprint, accepted manuscript, published, erratum)

# Paper rights — set now, before anyone (person or agent) works from the paper.
# Default: nothing from the paper is committed or published (PDF, full text,
# extracted text/equations, figure crops stay in the gitignored source/ folder).
rights:
  license: unknown          # CC-BY-4.0 | CC-BY-NC-4.0 | CC0-1.0 | public-domain | arXiv-nonexclusive | publisher-copyright | unknown | <other>
  license_url: ""
  copy_url: ""              # the copy we work from; prefer an open-access or arXiv version when one exists
  open_version: ""          # open-access / arXiv URL, or "none found"
  access: unknown           # open-access | subscription | personal-copy | author-provided | under-review | unknown
  access_terms: ""          # text/data-mining and AI clauses of the access license (and the AI tool's data terms), with a link
  rules:
    redistribute: false     # may the PDF, text, equations or figure crops be committed or published? only if the license allows (e.g. CC BY)
    quotes_in_spec: true    # short quotes with section citations in spec.yaml
    ai_tools: allowed       # allowed | local-only | never — published paper read for research: usually allowed; under review: never
  permissions: []           # author/publisher permissions: {from, date, grants: [redistribute, ai-tools, figures], ref}

# Code-use policy, set now — not mid-project.
policy:
  when_silent: [authors-code, convention, author-question, deviation]   # preference order when the paper is silent
  authors_code:
    url: ""
    license: unknown
    use: reference-only      # allowed | reference-only | off-limits
  off_limits: []             # sources nobody may open (e.g. GPL code we rebuild from its paper)

items:
  - id: example.param
    kind: parameter          # equation | parameter | protocol | architecture | data | panel | claim | foundation | other
    text: "what the paper says, in its words"
    section: "§2.1"
    status: stated           # stated | missing | ambiguous | contradicted
    value: null
