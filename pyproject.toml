[project]
name = "pawtrace"
version = "0.1.0"
description = "A modular pipeline for rebuilding and checking published computational research, for people and AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Devin Auch" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
# `extract` module, lightweight backend: PDFium (Apache-2.0 / BSD-3-Clause) — offline, no GPU
extract = ["pypdfium2>=4.30", "pillow>=10"]

[project.scripts]
pawtrace = "pawtrace.cli:main"

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.8", "pypdfium2>=4.30", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pawtrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
